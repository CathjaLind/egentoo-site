<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>egentoo | Built for the Wild</title>
    
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --pine-green: #253912; --sandstone: #f2ede6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--sandstone); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        
        header { text-align: center; margin-bottom: 40px; }
        .brand-crest { width: 100%; max-width: 300px; }
        .logo { font-family: 'Cabinet Grotesk', sans-serif; font-size: 3rem; color: var(--pine-green); font-weight: 900; }
        
        main { max-width: 500px; width: 100%; text-align: center; }
        .form-container { display: flex; flex-direction: column; gap: 15px; background: white; padding: 20px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.1); }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 12px; background: var(--pine-green); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .cf-turnstile { margin: 10px auto; }
    </style>
</head>
<body>

    <header>
        <svg class="brand-crest" viewBox="0 0 500 170" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M70 150 L195 40 L265 110 L350 15 L435 125" stroke="#253912" stroke-width="5.5" stroke-linecap="round"/>
            </svg>
        <div class="logo">egentoo</div>
    </header>

    <main>
        <form class="form-container" action="https://formspree.io/f/mredybro" method="POST">
            <input type="email" name="email" placeholder="Enter your email address" required>
            
            <div class="cf-turnstile" data-sitekey="0x4AAAAAADWJ4G1TgFtica-0"></div>
            
            <button type="submit">Join the Expedition</button>
        </form>
    </main>

</body>
</html>

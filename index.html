    <style>
        :root {
            --forest-green: #253912;
            --deep-canopy: #18250c;
            --charcoal: #232522;
            --sandstone-light: #f4eee3;
            --sandstone-deep: #cca883;
            --shale-blue: #96a5ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--charcoal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
            
            /* The Rich Misty Mountain atmospheric gradient from your image */
            background: linear-gradient(to bottom, 
                #b2cae0 0%, 
                var(--sandstone-light) 40%, 
                var(--sandstone-deep) 100%
            );
        }

        /* Ambient background mist effect */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 80% 30%, rgba(255,255,255,0.4) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        /* Top Navigation Bar mimicking your header */
        nav {
            background-color: var(--forest-green);
            padding: 14px 20px;
            display: flex;
            justify-content: center;
            gap: 25px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            flex-wrap: wrap; /* Allows menu rows to wrap cleanly on ultra-small screens */
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: lowercase;
            opacity: 0.75;
            transition: opacity 0.2s ease;
        }

        nav a:hover {
            opacity: 1;
        }

        /* Main Container */
        .wrapper {
            max-width: 1100px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
        }

        /* --- THE COMPLETE LOGO EMBLEM EMBED --- */
        .brand-logo-emblem {
            width: 100%;
            max-width: 520px;
            height: auto;
            margin-bottom: 5px;
        }

        /* Beautifully structured tracking for the main catchphrase */
        .main-tagline {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--forest-green);
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 40px;
            line-height: 1.25;
            padding: 0 10px;
        }

        /* --- GALLERY EXHIBIT GRID --- */
        .exhibit-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            width: 100%;
            margin-bottom: 50px;
        }

        .exhibit-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 32px rgba(37, 57, 18, 0.06);
        }

        .exhibit-title {
            font-family: 'Fraunces', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--forest-green);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Decorative tiny compass indicator inside headers */
        .mini-compass {
            width: 16px;
            height: 16px;
            border: 2px solid var(--forest-green);
            border-radius: 50%;
            position: relative;
            display: inline-block;
        }
        .mini-compass::after {
            content: '';
            position: absolute;
            top: 2px; left: 5px;
            width: 0; height: 0;
            border-left: 2px solid transparent; border-right: 2px solid transparent;
            border-bottom: 5px solid var(--forest-green);
        }

        .exhibit-image-placeholder {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(37, 57, 18, 0.1);
        }

        /* Generates high-quality matching premium adventure placeholders */
        .img-1 { background-image: url('https://images.unsplash.com/photo-1620000617482-821324eb9a14?auto=format&fit=crop&q=80&w=600'); }
        .img-2 { background-image: url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&q=80&w=600'); }
        .img-3 { background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=600'); }

            max-width: 540px;
            width: 100%;
            margin: 0 auto 20px auto;
        }

        .signup-section p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: rgba(35, 37, 34, 0.85);
            margin-bottom: 20px;
            font-weight: 500;
            padding: 0 10px;
        }

        .form-container {
            background-color: #ffffff;
            padding: 6px;
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(37, 57, 18, 0.08);
            display: flex;
            border: 1px solid rgba(37, 57, 18, 0.1);
        }

            border: none;
            padding: 14px 22px;

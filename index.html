<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>egentoo | Exploring the wild, one paw print at a time.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --forest-green: #253912;
            --deep-canopy: #18250c;
            --charcoal: #232522;
            --sandstone-light: #f4eee3;
            --sandstone-deep: #cca883;
            --shale-blue: #96a5ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--charcoal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
            
            /* The Rich Misty Mountain atmospheric gradient from your image */
            background: linear-gradient(to bottom, 
                #b2cae0 0%, 
                var(--sandstone-light) 40%, 
                var(--sandstone-deep) 100%
            );
        }

        /* Ambient background mist effect */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 80% 30%, rgba(255,255,255,0.4) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        /* Top Navigation Bar mimicking your header */
        nav {
            background-color: var(--forest-green);
            padding: 14px 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: lowercase;
            opacity: 0.75;
            transition: opacity 0.2s ease;
        }

        nav a:hover {
            opacity: 1;
        }

        /* Main Container */
        .wrapper {
            max-width: 1100px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 2;
        }
